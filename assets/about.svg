<text x="890" y="176" font-size="12" fill="#22d3ee" font-weight="600" text-anchor="start">web dev · ai engineer</text>
<text x="798" y="200" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">base:</text>
<text x="890" y="200" font-size="12" fill="#22d3ee" font-weight="600" text-anchor="start">lahore, pakistan</text>
