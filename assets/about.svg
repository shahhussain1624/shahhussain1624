<text x="890" y="224" font-size="12" fill="#8b5cf6" font-weight="600" text-anchor="start">freelance | remote</text>
<text x="798" y="248" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">since:</text>
<text x="890" y="248" font-size="12" fill="#22d3ee" font-weight="600" text-anchor="start">2024</text>
