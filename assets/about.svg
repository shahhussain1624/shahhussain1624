<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'JetBrains Mono','Fira Code','Courier New',monospace">
<defs>
      <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.4" fill="#1b2740"/></pattern>
      <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f59e0b"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#8b5cf6"/>
      </linearGradient>
    </defs>
<rect width="1200" height="360" rx="16" fill="#070b14"/>
