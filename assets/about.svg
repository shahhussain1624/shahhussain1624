<text x="40" y="52" font-size="13" fill="#f59e0b" font-weight="700" text-anchor="start">&gt;</text>
<text x="58" y="52" font-size="13" fill="#e2e8f0" font-weight="700" text-anchor="start" letter-spacing="1">node_01 :: trigger</text>
<text x="229.57" y="52" font-size="12" fill="#475569" font-weight="400" text-anchor="start">// who is running this workflow</text>
<rect x="1081" y="36" width="79" height="22" rx="11" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.5"/>
<circle cx="1097" cy="47" r="4" fill="#f59e0b"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="1108.7" y="51" font-size="10" fill="#f59e0b" font-weight="700" text-anchor="start" letter-spacing="1.5">MANUAL</text>
<line x1="40" y1="70" x2="1160" y2="70" stroke="#1b2740" stroke-width="1"/>
<text x="44" y="118" font-size="19" fill="#e2e8f0" font-weight="600" text-anchor="start">Most developers build the app and stop there.</text>
<text x="44" y="148" font-size="19" fill="#94a3b8" font-weight="400" text-anchor="start">I build the app — then build the system that runs it</text>
<text x="44" y="178" font-size="19" fill="#94a3b8" font-weight="400" text-anchor="start">without anyone watching.</text>
<text x="44" y="230" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">Computer Science student at the University of Lahore, freelancing since</text>
<text x="44" y="252" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">2024. I write agents that finish multi-step tasks on their own, workflows</text>
<text x="44" y="274" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">that fire on webhooks, and pipelines that clean up after themselves.</text>
<text x="44" y="306" font-size="13" fill="#22c55e" font-weight="600" text-anchor="start">If a task is repeatable, it should be automated.</text>
<rect x="778" y="96" width="382" height="196" rx="10" fill="#0d1526" stroke="#1b2740"/>
<rect x="778" y="96" width="382" height="28" rx="10" fill="#22d3ee" fill-opacity="0.10"/>
<rect x="778" y="112" width="382" height="12" fill="#0d1526"/>
